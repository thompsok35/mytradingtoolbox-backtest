name: CI & Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: .NET 10 Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore MyTradingToolbox.Backtest.sln

      - name: Build Solution
        run: dotnet build MyTradingToolbox.Backtest.sln --no-restore --configuration Release

      - name: Execute Automated Tests
        run: dotnet test tests/MyTradingToolbox.Tests/MyTradingToolbox.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend-build:
    name: React Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build & Typecheck
        working-directory: ./frontend
        run: npm run build
